name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble
        run: |
          rm -rf dist && mkdir -p dist/.next
          cp -r .next/standalone/. dist/
          cp -r .next/static dist/.next/static
          [ -d public ] && cp -r public dist/public || true
          cp server.js dist/
          cp -r server dist/
          mkdir -p dist/src/core && cp src/core/mapping.js dist/src/core/
          npm ci --omit=dev
          cp -r node_modules dist/node_modules

      - name: Deploy
        run: rsync -a --delete --exclude '.next/cache' dist/ /opt/app/

      - name: Restart
        run: sudo systemctl restart nextjs

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ -o /dev/null && exit 0
            sleep 2
          done
          sudo systemctl status nextjs --no-pager -l
          exit 1
